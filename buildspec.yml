version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Docker Hub...
      - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin

  build:
    commands:
      - echo Building backend image...
      - docker build -t mallesh2210/devops-backend ./backend

      - echo Building frontend image...
      - docker build -t mallesh2210/devops-frontend ./frontend

  post_build:
    commands:
      - echo Pushing Docker images...
      - docker push mallesh2210/devops-backend
      - docker push mallesh2210/devops-frontend

      - echo Deploying to EC2 server...

      - echo "$EC2_KEY" > key.pem
      - chmod 600 key.pem

      - ssh -o StrictHostKeyChecking=no -i key.pem $EC2_USER@$EC2_HOST "
          cd ~/Devops-assessment &&
          git pull origin main &&
          docker-compose down &&
          docker-compose pull &&
          docker-compose up -d --build
        "

      - echo Deployment completed successfully 🚀
