version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Docker Hub...
      - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

  build:
    commands:
      - echo Building backend image...
      - docker build -t mallesh2210/devops-backend ./backend

      - echo Building frontend image...
      - docker build -t mallesh2210/devops-frontend ./frontend

  post_build:
    commands:
      - echo Pushing Docker images...
      - docker push mallesh2210/devops-backend
      - docker push mallesh2210/devops-frontend

      - echo Creating SSH key...
      - echo "$EC2_KEY_B64" | base64 -d > key.pem
      - chmod 600 key.pem

      - echo Testing SSH connection...
      - ssh -o StrictHostKeyChecking=no -i key.pem $EC2_USER@$EC2_HOST "echo SSH Connected"

      - echo Copying docker-compose.yml to EC2...
      - ssh -o StrictHostKeyChecking=no -i key.pem $EC2_USER@$EC2_HOST "mkdir -p ~/Devops-assessment"
      - scp -o StrictHostKeyChecking=no -i key.pem docker-compose.yml $EC2_USER@$EC2_HOST:~/Devops-assessment/docker-compose.yml

      - echo Deploying to EC2...
      - ssh -o StrictHostKeyChecking=no -i key.pem $EC2_USER@$EC2_HOST "
          cd ~/Devops-assessment &&
          docker-compose pull &&
          docker-compose down &&
          docker-compose up -d
        "

      - echo Deployment completed successfully!
