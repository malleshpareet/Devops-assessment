version: "3"

services:
  backend:
    build:
      context: ./backend
    container_name: devops_backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=production-secret-key-123
      - DEBUG=False
      - ALLOWED_HOSTS=*
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://13.233.148.119:8000
    container_name: devops_frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped
